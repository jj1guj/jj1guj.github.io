services:
  jekyll:
    image: ruby:3.3-bookworm
    working_dir: /srv/jekyll
    command: >-
      sh -lc "gem install bundler && bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - ./.bundle:/usr/local/bundle
